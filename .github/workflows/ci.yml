name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest 已是 26.04，其 setup-python 版本清单里没有 3.9，
        # 所以 3.9 固定跑 22.04，新版本跑 latest。
        include:
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 语法检查
        run: |
          python -m compileall -q monitor.py tests

      - name: 单元测试（离线，不联网）
        run: |
          python -m unittest discover -s tests -v

      - name: 命令行自检
        run: |
          python monitor.py --help
